<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFi Setup</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:420px;margin:40px auto;padding:20px;background:#f0f0f0}
    .box{background:white;padding:24px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:20px}
    h1{color:#333;margin-top:0}
    label{display:block;font-weight:bold;color:#555;margin:12px 0 4px}
    input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box}
    button{width:100%;padding:14px;font-size:16px;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:12px}
    .btn-wifi{background:#0066cc}
    .btn-back{background:#666}
    .info{background:#e7f3ff;padding:12px;border-radius:5px;color:#004085;font-size:14px;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="box">
    <h1>WiFi Setup</h1>
    <div class="info">Configure WiFi for Radio URL and FTP mode. SD Card mode can keep playing even when WiFi is unavailable.</div>
    <form action="/savewifi" method="POST">
      <label>WiFi Network (SSID):</label>
      <input type="text" name="ssid" placeholder="WiFi network name" value="{{WIFI_SSID}}">
      <label>WiFi Password:</label>
      <input type="password" name="password" placeholder="WiFi password">
      <button type="submit" class="btn-wifi">Save WiFi</button>
    </form>
    <button class="btn-back" onclick="location.href='/'">Back</button>
  </div>
</body>
</html>
