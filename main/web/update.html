<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firmware Update</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:500px;margin:20px auto;padding:20px;background:#f0f0f0}
    .box{background:white;padding:24px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
    h1{color:#333;margin-top:0}
    .info{background:#e7f3ff;padding:12px;border-radius:5px;margin-bottom:16px;font-size:14px;line-height:1.5}
    .warn{background:#fff8e1;padding:12px;border-radius:5px;margin-bottom:16px;color:#6b5600;font-size:14px}
    input[type=file]{width:100%;margin:10px 0;font-size:15px}
    button{width:100%;padding:13px;font-size:16px;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:8px;background:#0066cc}
    button:disabled{background:#999}
    button.alt{background:#666}
    progress{width:100%;height:22px;margin-top:12px}
    #msg{margin-top:12px;font-weight:bold}
  </style>
</head>
<body>
<div class="box">
  <h1>Firmware Update</h1>
  <div class="info">{{FW_INFO}}</div>
  <div class="warn">Select <code>build/ESP32BGM.bin</code>. Playback stops during the upload.
    If the new firmware does not come up, the device rolls back to this version on its own.</div>
  <input type="file" id="fw" accept=".bin">
  <button id="go" onclick="upload()">Upload &amp; install</button>
  <progress id="bar" value="0" max="100" style="display:none"></progress>
  <div id="msg"></div>
  <button class="alt" onclick="location.href='/'">Back</button>
</div>
<script>
  function upload(){
    const f=document.getElementById('fw').files[0];
    const msg=document.getElementById('msg'), bar=document.getElementById('bar'), go=document.getElementById('go');
    if(!f){msg.innerText='Choose a .bin file first';return;}
    go.disabled=true; bar.style.display='block'; msg.innerText='Uploading...';
    const x=new XMLHttpRequest();
    x.open('POST','/update');
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable)bar.value=Math.round(e.loaded*100/e.total);};
    x.onload=()=>{
      if(x.status==200){msg.innerText='Installed. Rebooting...';setTimeout(()=>location.href='/',20000);}
      else{msg.innerText='Failed: '+x.responseText;go.disabled=false;}
    };
    x.onerror=()=>{msg.innerText='Upload failed (connection lost)';go.disabled=false;};
    x.send(f);
  }
</script>
</body>
</html>
