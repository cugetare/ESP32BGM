; PlatformIO Project Configuration File
; ESP32 Web Radio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; LittleFS filesystem upload
board_build.filesystem = littlefs

; Larger app partition — audio libs are big
board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libhelix.git
    https://github.com/pschatzmann/arduino-audio-driver.git

build_flags =
    -DARDUINO_AUDIO_KIT_ES8388
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Increase stack usage tracking verbosity (remove in production)
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
